<!-- hero section -->
<section class="relative overflow-hidden min-h-[720px] sm:px-8 lg:px-16 py-8">
  <!-- purple glow backgrounds -->
  <div 
    class="pointer-events-none absolute z-0
           w-[2800px] h-[2400px] 
           -left-[350px] top-[1100px]
           sm:w-[2000px] sm:h-[1000px] 
           sm:-left-[250px] sm:top-[1100px]
           md:w-[2400px] md:h-[1200px] 
           md:-left-[300px] md:top-[1200px]
           lg:w-[2816px] lg:h-[1363px] 
           lg:-left-[353px] lg:top-[1320px]
           opacity-50"
    style="background: radial-gradient(47.95% 47.95% at 50% 50%, rgba(124, 58, 237, 0.5) 0%, rgba(124, 58, 237, 0) 100%);"
  ></div>

  <div 
    class="pointer-events-none absolute z-0
           w-[2800px] h-[2400px] 
           -left-[350px] top-[4100px]
           sm:w-[2000px] sm:h-[1000px] 
           sm:-left-[250px] sm:top-[1100px]
           md:w-[2400px] md:h-[1200px] 
           md:-left-[300px] md:top-[1200px]
           lg:w-[2816px] lg:h-[1363px] 
           lg:-left-[353px] lg:top-[2920px]
           opacity-50"
    style="background: radial-gradient(47.95% 47.95% at 50% 50%, rgba(124, 58, 237, 0.5) 0%, rgba(124, 58, 237, 0) 100%);"
  ></div>

  <!-- lights  -->
  <div class="hero-lights pointer-events-none absolute inset-0 z-0"></div>

  <!-- main hero content -->
  <div class="relative z-10 justify-self-center px-4">
    <div class="max-w-[700px] mt-35 max-sm:mt-30 mb-20">
      <h1 class="text-white font-sora font-semibold text-8xl max-sm:text-center max-sm:text-6xl">
        Gdje Izlazimo
      </h1>

      <p
        class="text-[var(--text-secondary)] text-[22px] justify-self-end italic font-light
               max-sm:text-[14.5px] max-sm:mt-2 max-sm:justify-self-center"
      >
        Pronađi lokal i <span class="text-white">rezerviši</span> sto u
        <span class="text-white">30 sekundi</span>
      </p>
    </div>

    <app-search-bar></app-search-bar>

    <!-- trust us -->
    <div 
      inView
      (inViewChange)="onStatsInView($event)"
      class="mt-54 flex flex-col items-center opacity-0 translate-y-8 transition-all duration-700 ease-out"
      [class.opacity-100]="statsShown"
      [class.translate-y-0]="statsShown"
    >
      <div
        class="font-sheftira italic text-[57px] leading-[1.0611] opacity-90
               bg-[radial-gradient(circle_at_center,#F2E5FF_0%,#7C3AED_100%)]
               bg-clip-text text-transparent
               max-sm:text-[46px]"
      >
        Sarajevo
      </div>

      <div class="mt-3 flex items-center gap-10 max-sm:gap-6">
        <div class="font-dm italic font-medium text-[20px] leading-[1.0611] text-white/80 max-sm:text-[16px]">
          {{ reservations | number }}+ <span class="font-light text-white/50">rezervacija</span>
        </div>

        <div class="font-dm italic font-medium text-[20px] leading-[1.0611] text-white/80 max-sm:text-[16px]">
          {{ venuesCount | number }}+ <span class="font-light text-white/50">lokala</span>
        </div>
      </div>

      <div class="mt-5 flex items-center">
        <div class="h-[5px] w-[5px] rounded-full bg-white/20"></div>
        <div class="h-px w-[537px] bg-white/20 max-sm:w-[280px]"></div>
        <div class="h-[5px] w-[5px] rounded-full bg-white/20"></div>
      </div>
    </div>
  </div>

  <!-- marquee layer  -->
  <div class="relative z-[5]">
    <app-bg-cards-marquee [venues]="venues" [twoRows]="true"></app-bg-cards-marquee>
  </div>

  <!-- other sections  -->
  <section class="mt-30 px-5">
    <app-popular-venues
      [title]="'Najpopularniji Lokali'"
      [subtitle]="'Najtraženiji ove sedmice'"
      [venues]="popularVenues"
    ></app-popular-venues>
  </section>

  <section class="mt-30">
    <app-how-it-works></app-how-it-works>
  </section>

  <section class="mt-30">
    <app-cta></app-cta>
  </section>
</section>
