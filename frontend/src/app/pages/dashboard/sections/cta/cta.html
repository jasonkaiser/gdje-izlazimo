<section
  #ctaEl
  class="relative w-full overflow-hidden py-18 sm:py-24"
>
  <div class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8">
    <div class="relative text-center">
      <!-- HEADER -->
      <div
        class="transition-all duration-700 ease-out"
        [class.translate-y-6]="!inView()"
        [class.opacity-0]="!inView()"
        [class.translate-y-0]="inView()"
        [class.opacity-100]="inView()"
      >
        <h2 class="font-sora text-5xl font-regular tracking-[0.02em] gradient-text text-white px-4">
          Spreman za izlazak večeras?
                  <p class="sm:mt-3 mt-5 font-dm text-[15px] font-light italic text-white/1 mb-1">
                  Pronađi lokal ili event za 30 sekundi.
                 </p>
        </h2>

      </div>

   
      <div
        class="pointer-events-none absolute left-1/2 top-[224px] -translate-x-1/2
              font-sheftira italic tracking-[0.02em]
              text-[56px] sm:text-[120px] lg:text-[140px]
              leading-none whitespace-nowrap select-none max-sm:top-[363px]
              fade-edges
              bg-gradient-to-r from-white/[0.02] via-white/[0.08] to-zinc-200/[0.03]
              bg-clip-text text-transparent"
      >
        GDJE IZLAZIMO
      </div>

      <!-- CONTENT -->
      <div class="relative mt-40 sm:mt-52">
     
        <div class="mx-auto flex max-w-3xl flex-wrap items-center justify-center max-sm:flex-col sm:gap-x-50 gap-y-3">
          <span 
            class="font-dm text-[16px] sm:text-[18px] uppercase tracking-[0.12em] text-white/55
                  transition-all duration-700 ease-out"
            [style.transitionDelay.ms]="inView() ? 120 : 0"
            [class.translate-y-4]="!inView()"
            [class.opacity-0]="!inView()"
            [class.translate-y-0]="inView()"
            [class.opacity-100]="inView()"
          >
            Opusteno
          </span>
          <span 
            class="font-dm text-[16px] sm:text-[18px] uppercase tracking-[0.12em] text-white/85 font-bold
                  transition-all duration-700 ease-out"
            [style.transitionDelay.ms]="inView() ? 190 : 0"
            [class.translate-y-4]="!inView()"
            [class.opacity-0]="!inView()"
            [class.translate-y-0]="inView()"
            [class.opacity-100]="inView()"
          >
            Brzo
          </span>
          <span 
            class="font-dm text-[16px] sm:text-[18px] uppercase tracking-[0.12em] text-white/55
                  transition-all duration-700 ease-out"
            [style.transitionDelay.ms]="inView() ? 260 : 0"
            [class.translate-y-4]="!inView()"
            [class.opacity-0]="!inView()"
            [class.translate-y-0]="inView()"
            [class.opacity-100]="inView()"
          >
            Jednostavno
          </span>
        </div>

        <!-- HR -->
        <div
          class="mx-auto mt-16 sm:mt-18 w-full max-w-full 
                transition-all duration-700 ease-out"
          [style.transitionDelay.ms]="inView() ? 330 : 0"
          [class.translate-y-6]="!inView()"
          [class.opacity-0]="!inView()"
          [class.translate-y-0]="inView()"
          [class.opacity-100]="inView()"
        >
          <div class="cta-hr-fade"></div>
        </div>

        <!-- BUTTON -->
        <div class="mt-10 sm:mt-12 flex flex-col items-center gap-6 mb-20">
          
           <a href="/venues"
            class="cta-btn-modern-solid inline-flex items-center justify-center gap-3
                  rounded-full px-7 py-3.5 bg-[#7c3aed]
                  font-dm text-[16px] sm:text-[18px] tracking-[0.06em] uppercase text-white
                  transition-all duration-600 ease-[cubic-bezier(0.34,1.56,0.64,1)]"
      [style.transitionDelay.ms]="inView() ? 50 : 0"
      [class.translate-y-8]="!inView()"
      [class.scale-75]="!inView()"
      [class.translate-y-0]="inView()"
      [class.scale-100]="inView()"
          >
            PRONADJI VECERASNJI IZLAZAK
            <span class="grid place-items-center">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" class="text-white">
                <path d="M7 17L17 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                <path d="M9 7h8v8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </span>
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
