<section class="relative w-full overflow-hidden rounded-3xl px-4 sm:px-8 py-6">
  <!-- Header -->
  <div class="relative flex items-start justify-between gap-6">
    <div class="w-full text-center sm:text-left">
      <h2 class="font-sora text-5xl font-semibold tracking-tight max-sm:justify-self-center text-white">
        {{ title }}
      </h2>
      <p class="mt-1 font-dm text-sm font-light italic text-white/60 mb-10">
        {{ subtitle }}
      </p>
    </div>

    <!-- Desktop controls only -->
    <div class="hidden sm:flex items-center gap-3 shrink-0">
      <div class="flex items-center gap-2">
        <button
          type="button"
          (click)="scrollPrev()"
          [disabled]="!canPrev"
          class="grid h-9 w-25 place-items-center rounded-full border border-white/15 bg-white/5 text-white/80 transition hover:bg-white/10 disabled:opacity-30 disabled:cursor-not-allowed"
          aria-label="Previous"
        >
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button
          type="button"
          (click)="scrollNext()"
          [disabled]="!canNext"
          class="grid h-9 w-25 place-items-center rounded-full border border-white/15 bg-white/5 text-white/80 transition hover:bg-white/10 disabled:opacity-30 disabled:cursor-not-allowed"
          aria-label="Next"
        >
     
           <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M9 18L15 12L9 6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <a

        href="/venues"
        class="h-9 rounded-full bg-violet-600 px-4 text-xs flex items-center font-semibold uppercase tracking-wide text-white transition hover:bg-violet-500"
      >
        POGLEDAJ SVE <span class="ml-1">↗</span>
    </a>
    </div>
  </div>

  <!-- Carousel -->
  <div class="mt-6 -mx-4 sm:mx-0">
    <!-- Mobile: Vertical Stack -->
    <div class="sm:hidden flex flex-col gap-6 px-4">
      @for (v of venues; track v.title) {
        <div class="w-full max-w-[380px] mx-auto">
          <app-venue-card
            [title]="v.title"
            [category]="v.category"
            [location]="v.location"
            [imageUrl]="v.imageUrl"
          />
        </div>
      }
    </div>

    <!-- Desktop: Horizontal Scroll -->
    <div
      #scroller
      (scroll)="onScroll()"
      class="hidden sm:flex no-scrollbar relative overflow-x-auto pb-2
             gap-10
             [-webkit-overflow-scrolling:touch]
             [scroll-snap-type:x_mandatory]
             overscroll-x-contain scroll-smooth"
      aria-label="Popular venues"
    >
      @for (v of venues; track v.title; let i = $index) {
        <div
          data-card
          class="shrink-0
                 [scroll-snap-align:start]
                 transition-opacity duration-300"
          [class.opacity-40]="isPeekDesktopLeftOrRight(i)"
        >
          <div class="w-[300px] lg:w-[360px]">
            <app-venue-card
              [title]="v.title"
              [category]="v.category"
              [location]="v.location"
              [imageUrl]="v.imageUrl"
            />
          </div>
        </div>
      } @empty {
        <div class="text-white/60">No venues</div>
      }
    </div>

    <!-- Mobile CTA at bottom only - 10% narrower from both sides -->
    <button
      type="button"
      class="mt-10 h-10 w-[87%] mx-auto block rounded-full bg-violet-600 px-4 text-xs font-semibold uppercase tracking-wide text-white transition hover:bg-violet-500 sm:hidden"
    >
      POGLEDAJ SVE <span class="ml-1">↗</span>
    </button>
  </div>
</section>
