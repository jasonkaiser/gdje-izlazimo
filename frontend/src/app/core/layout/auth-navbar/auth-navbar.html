<!-- AUTH HEADER -->
<header class="sticky top-5 z-60 w-[95%] place-self-center">
  <div class="mx-auto flex items-center justify-between rounded-2xl px-5 py-3">

    <!-- LOGO -->
    <a routerLink="/" class="font-sora font-semibold tracking-tight text-[var(--text-primary)]">
      GDJE-IZLAZIMO
    </a>

    <!-- DESKTOP: center pill navigation -->
    <nav
      class="hidden md:flex items-center gap-8 rounded-full border border-white/10 bg-black px-8 py-2"
      aria-label="Primary"
    >
      <a routerLink="/" [routerLinkActiveOptions]="{ exact: true }"
        routerLinkActive="!text-[var(--text-primary)] after:scale-x-100 after:opacity-100"
        class="relative font-dm font-light text-sm tracking-wide text-[var(--text-secondary)] hover:text-[var(--text-primary)] transition
               after:content-[''] after:absolute after:left-0 after:-bottom-2 after:h-[2px] after:w-full after:rounded-full
               after:bg-[var(--color-primary)] after:scale-x-0 after:opacity-0 after:origin-left after:transition after:duration-300">
        POCETNA
      </a>

      <a routerLink="/reservations" routerLinkActive="!text-[var(--text-primary)] after:scale-x-100 after:opacity-100"
        class="relative font-dm font-light text-sm tracking-wide text-[var(--text-secondary)] hover:text-[var(--text-primary)] transition
               after:content-[''] after:absolute after:left-0 after:-bottom-2 after:h-[2px] after:w-full after:rounded-full
               after:bg-[var(--color-primary)] after:scale-x-0 after:opacity-0 after:origin-left after:transition after:duration-300">
        REZERVACIJE
      </a>

      <a routerLink="/venues" routerLinkActive="!text-[var(--text-primary)] after:scale-x-100 after:opacity-100"
        class="relative font-dm font-light text-sm tracking-wide text-[var(--text-secondary)] hover:text-[var(--text-primary)] transition
               after:content-[''] after:absolute after:left-0 after:-bottom-2 after:h-[2px] after:w-full after:rounded-full
               after:bg-[var(--color-primary)] after:scale-x-0 after:opacity-0 after:origin-left after:transition after:duration-300">
        LOKALI
      </a>

      <a routerLink="/events" routerLinkActive="!text-[var(--text-primary)] after:scale-x-100 after:opacity-100"
        class="relative font-dm font-light text-sm tracking-wide text-[var(--text-secondary)] hover:text-[var(--text-primary)] transition
               after:content-[''] after:absolute after:left-0 after:-bottom-2 after:h-[2px] after:w-full after:rounded-full
               after:bg-[var(--color-primary)] after:scale-x-0 after:opacity-0 after:origin-left after:transition after:duration-300">
        DOGADJAJI
      </a>

      <a routerLink="/map" routerLinkActive="!text-[var(--text-primary)] after:scale-x-100 after:opacity-100"
        class="relative font-dm font-light text-sm tracking-wide text-[var(--text-secondary)] hover:text-[var(--text-primary)] transition
               after:content-[''] after:absolute after:left-0 after:-bottom-2 after:h-[2px] after:w-full after:rounded-full
               after:bg-[var(--color-primary)] after:scale-x-0 after:opacity-0 after:origin-left after:transition after:duration-300">
        MAPA
      </a>

      @if (hasRole('venue_owner')) {
        <a routerLink="/venue-panel" routerLinkActive="!text-[var(--text-primary)] after:scale-x-100 after:opacity-100"
          class="relative font-dm font-light text-sm tracking-wide text-[var(--text-secondary)] hover:text-[var(--text-primary)] transition
                 after:content-[''] after:absolute after:left-0 after:-bottom-2 after:h-[2px] after:w-full after:rounded-full
                 after:bg-[var(--color-primary)] after:scale-x-0 after:opacity-0 after:origin-left after:transition after:duration-300">
          VENUE PANEL
        </a>
      }

      @if (hasRole('admin')) {
        <a routerLink="/admin-panel" routerLinkActive="!text-[var(--text-primary)] after:scale-x-100 after:opacity-100"
          class="relative font-dm font-light text-sm tracking-wide text-[var(--text-secondary)] hover:text-[var(--text-primary)] transition
                 after:content-[''] after:absolute after:left-0 after:-bottom-2 after:h-[2px] after:w-full after:rounded-full
                 after:bg-[var(--color-primary)] after:scale-x-0 after:opacity-0 after:origin-left after:transition after:duration-300">
          ADMIN
        </a>
      }
    </nav>

    <!-- DESKTOP: logout button -->
    <button type="button" (click)="logout()"
      class="hidden md:inline-flex items-center gap-2 rounded-full border border-white/10 bg-white/5 px-5 py-2 font-dm font-medium text-sm text-[var(--text-primary)] hover:bg-white/10 hover:border-white/20 transition">
      ODJAVA
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
        <path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h6a2 2 0 012 2v1" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <!-- MOBILE: logout button only -->
    <div class="flex items-center md:hidden">
      <button type="button" (click)="logout()"
        class="inline-flex items-center gap-1.5 rounded-full border border-white/10 bg-white/5 px-4 py-2 font-dm font-medium text-sm text-[var(--text-primary)]">
        ODJAVA
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
          <path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h6a2 2 0 012 2v1" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<!-- AUTH MOBILE BOTTOM NAV -->
<nav class="fixed bottom-0 left-0 right-0 z-50 md:hidden">
  <div class="absolute inset-0 bg-black/80 backdrop-blur-2xl border-t border-white/[0.06]"></div>

  <div class="relative flex items-center justify-around px-2 pb-safe pt-1 pb-3">

    <!-- POČETNA -->
    <a routerLink="/" [routerLinkActiveOptions]="{exact:true}"
       routerLinkActive="!text-white"
       class="flex flex-col items-center gap-1 px-3 py-2 text-white/30 transition-all duration-200 flex-1 max-w-[64px]">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/>
        <path d="M9 21V12h6v9"/>
      </svg>
      <span class="text-[10px] font-dm font-medium tracking-wide">Početna</span>
    </a>

    <!-- LOKALI -->
    <a routerLink="/venues"
       routerLinkActive="!text-white"
       class="flex flex-col items-center gap-1 px-3 py-2 text-white/30 transition-all duration-200 flex-1 max-w-[64px]">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-4h6v4"/>
      </svg>
      <span class="text-[10px] font-dm font-medium tracking-wide">Lokali</span>
    </a>

    <!-- DOGADJAJI — elevated center CTA -->
    <a routerLink="/events"
       class="flex flex-col items-center gap-1.5 relative flex-1 max-w-[72px] -mt-5">
      <div class="w-14 h-14 rounded-full bg-[var(--color-primary)] flex items-center justify-center
                  ring-4 ring-[rgba(124,58,237,0.25)]
                  animate-breathe
                  transition-all duration-200 active:scale-95">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2"/>
          <path d="M16 2v4M8 2v4M3 10h18"/>
        </svg>
      </div>
      <span class="text-[10px] font-dm font-medium tracking-wide text-[var(--color-primary)]">Dogadjaji</span>
    </a>

    <!-- MAPA -->
    <a routerLink="/map"
       routerLinkActive="!text-white"
       class="flex flex-col items-center gap-1 px-3 py-2 text-white/30 transition-all duration-200 flex-1 max-w-[64px]">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22c3.7-3.2 8-7.6 8-12.2A8 8 0 1 0 4 9.8C4 14.4 8.3 18.8 12 22Z"/>
        <circle cx="12" cy="10" r="2.5"/>
      </svg>
      <span class="text-[10px] font-dm font-medium tracking-wide">Mapa</span>
    </a>

    <!-- PROFIL -->
    <a routerLink="/profile"
       routerLinkActive="!text-white"
       class="flex flex-col items-center gap-1 px-3 py-2 text-white/30 transition-all duration-200 flex-1 max-w-[64px]">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
      </svg>
      <span class="text-[10px] font-dm font-medium tracking-wide">Profil</span>
    </a>

  </div>
</nav>
