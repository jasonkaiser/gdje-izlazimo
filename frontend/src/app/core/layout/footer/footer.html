<footer
  #footerEl
  class="relative w-full bg-black text-white px-6 py-12 overflow-hidden"
>
  <div class="mx-auto w-full px-4 sm:px-6 lg:px-8">
    <!-- Top row -->
    <div class="flex flex-col md:flex-row items-start justify-between gap-10">

      <!-- Left: Brand -->
      <div
        class="transition-all duration-700 ease-out"
        [class.translate-y-6]="!inView()"
        [class.opacity-0]="!inView()"
        [class.translate-y-0]="inView()"
        [class.opacity-100]="inView()"
      >
        <h2 class="font-sora text-2xl font-semibold tracking-tight text-white">
          Gdje Izlazimo
        </h2>
        <p class="mt-2 font-dm text-sm text-white/45">
          www.gdje-izlazimo.ba
        </p>
      </div>

      <!-- Right: Columns -->
      <div class="flex flex-col sm:flex-row gap-14 sm:gap-24 md:gap-40">

        <!-- Navigation -->
        <div>
          <div class="font-dm text-[11px] tracking-[0.22em] uppercase text-white/35 mb-4">
            Navigacija
          </div>
          <ul class="space-y-2.5">
            <li
              *ngFor="let link of navigationLinks; let i = index; trackBy: trackByName"
              class="transition-all duration-700 ease-out"
              [style.transitionDelay.ms]="inView() ? 120 + i * 70 : 0"
              [class.translate-y-4]="!inView()"
              [class.opacity-0]="!inView()"
              [class.translate-y-0]="inView()"
              [class.opacity-100]="inView()"
            >
              
                <a  [href]="link.href"
                class="font-dm text-sm text-white/75 hover:text-white transition-colors duration-200"
              >{{ link.name }}</a>
            </li>
          </ul>
        </div>

        <!-- Connect -->
        <div>
          <div class="font-dm text-[11px] tracking-[0.22em] uppercase text-white/35 mb-4">
            Connect
          </div>
          <ul class="space-y-3">

            <!-- Instagram -->
            <li
              class="transition-all duration-700 ease-out"
              [style.transitionDelay.ms]="inView() ? 200 : 0"
              [class.translate-y-4]="!inView()"
              [class.opacity-0]="!inView()"
              [class.translate-y-0]="inView()"
              [class.opacity-100]="inView()"
            >
              
                <a  href="https://www.instagram.com/gdjeizlazimo/"
                target="_blank"
                rel="noopener noreferrer"
                class="flex items-center gap-2 font-dm text-sm text-white/75 hover:text-white transition-colors duration-200"
              >
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" class="text-white/70">
                  <path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M17.5 6.5h.01" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
                </svg>
                Instagram
              </a>
            </li>

            <!-- TikTok -->
            <li
              class="transition-all duration-700 ease-out"
              [style.transitionDelay.ms]="inView() ? 270 : 0"
              [class.translate-y-4]="!inView()"
              [class.opacity-0]="!inView()"
              [class.translate-y-0]="inView()"
              [class.opacity-100]="inView()"
            >
              
              <a  href="https://www.tiktok.com/@gdjeizlazimo"
                target="_blank"
                rel="noopener noreferrer"
                class="flex items-center gap-2 font-dm text-sm text-white/75 hover:text-white transition-colors duration-200"
              >
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" class="text-white/70">
                  <path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                TikTok
              </a>
            </li>

            <!-- Email -->
            <li
              class="transition-all duration-700 ease-out"
              [style.transitionDelay.ms]="inView() ? 340 : 0"
              [class.translate-y-4]="!inView()"
              [class.opacity-0]="!inView()"
              [class.translate-y-0]="inView()"
              [class.opacity-100]="inView()"
            >
              
                <a  href="mailto:info@gdje-izlazimo.ba"
                class="flex items-center gap-2 font-dm text-sm text-white/75 hover:text-white transition-colors duration-200"
              >
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" class="text-white/70">
                  <path d="M4 4h16v16H4V4Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M4 7l8 6 8-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                Email
              </a>
            </li>

          </ul>
        </div>

      </div>
    </div>

    <!-- Bottom divider -->
    <div class="mt-10 h-px w-full bg-white/15"></div>

    <!-- Bottom row -->
    <div class="mt-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
      <p class="font-dm text-sm text-white/40">
        © 2026 www.gdje-izlazimo.ba - All rights reserved.
      </p>
    </div>

  </div>
</footer>
