<header class="sticky top-5 z-60 w-[95%] place-self-center">
  <div class="mx-auto flex items-center justify-between rounded-2xl px-5 py-3">
    <!-- LOGO -->
    <a routerLink="/" class="font-sora font-semibold tracking-tight text-[var(--text-primary)]">
      GDJE-IZLAZIMO
    </a>

    <!-- DESKTOP: center pill navigation -->
    <nav
      class="hidden md:flex items-center gap-8 rounded-full border border-white/10 bg-black px-8 py-2"
      aria-label="Primary"
    >
      <!-- POCETNA -->
      <a
        routerLink="/"
        [routerLinkActiveOptions]="{ exact: true }"
        routerLinkActive="!text-[var(--text-primary)] after:scale-x-100 after:opacity-100"
        class="relative font-dm font-light text-sm tracking-wide
               text-[var(--text-secondary)] hover:text-[var(--text-primary)] transition
               after:content-[''] after:absolute after:left-0 after:-bottom-2
               after:h-[2px] after:w-full after:rounded-full
               after:bg-[var(--color-primary)]
               after:scale-x-0 after:opacity-0 after:origin-left
               after:transition after:duration-300"
      >
        POCETNA
      </a>

      <!-- REZERVACIJE -->
      <a
        routerLink="/reservations"
        routerLinkActive="!text-[var(--text-primary)] after:scale-x-100 after:opacity-100"
        class="relative font-dm font-light text-sm tracking-wide
               text-[var(--text-secondary)] hover:text-[var(--text-primary)] transition
               after:content-[''] after:absolute after:left-0 after:-bottom-2
               after:h-[2px] after:w-full after:rounded-full
               after:bg-[var(--color-primary)]
               after:scale-x-0 after:opacity-0 after:origin-left
               after:transition after:duration-300"
      >
        REZERVACIJE
      </a>

      <!-- LOKALI -->
      <a
        routerLink="/venues"
        routerLinkActive="!text-[var(--text-primary)] after:scale-x-100 after:opacity-100"
        class="relative font-dm font-light text-sm tracking-wide
               text-[var(--text-secondary)] hover:text-[var(--text-primary)] transition
               after:content-[''] after:absolute after:left-0 after:-bottom-2
               after:h-[2px] after:w-full after:rounded-full
               after:bg-[var(--color-primary)]
               after:scale-x-0 after:opacity-0 after:origin-left
               after:transition after:duration-300"
      >
        LOKALI
      </a>

            <!-- DOGADJAJI -->
      <a
        routerLink="/events"
        routerLinkActive="!text-[var(--text-primary)] after:scale-x-100 after:opacity-100"
        class="relative font-dm font-light text-sm tracking-wide
               text-[var(--text-secondary)] hover:text-[var(--text-primary)] transition
               after:content-[''] after:absolute after:left-0 after:-bottom-2
               after:h-[2px] after:w-full after:rounded-full
               after:bg-[var(--color-primary)]
               after:scale-x-0 after:opacity-0 after:origin-left
               after:transition after:duration-300"
      >
        DOGADJAJI
      </a>
    </nav>

    <!-- DESKTOP: login button -->
    <button
      type="button"
      (click)="login()"
      class="hidden md:inline-flex items-center gap-2 rounded-full bg-[var(--color-primary)] px-5 py-2 font-dm font-medium text-sm text-white shadow-[0_10px_30px_rgba(124,58,237,0.35)] hover:brightness-110 transition"
    >
      LOGIN
      <span class="inline-flex h-6 w-6 items-center justify-center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" class="opacity-95">
          <path
            d="M7 17L17 7M17 7H9M17 7V15"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </span>
    </button>

    <!-- MOBILE: hamburger + login -->
    <div class="flex items-center gap-3 md:hidden">
      <button
        type="button"
        (click)="login()"
        class="inline-flex items-center gap-2 rounded-full bg-[var(--color-primary)] px-4 py-2 font-dm font-medium text-sm text-white"
      >
        LOGIN
        <span class="inline-flex h-6 w-6 items-center justify-center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" class="opacity-95">
            <path
              d="M7 17L17 7M17 7H9M17 7V15"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>
      </button>

      <button
        type="button"
        (click)="toggleMobile()"
        class="inline-flex h-10 w-10 items-center justify-center rounded-xl border border-white/10 bg-white/5 text-[var(--text-primary)]"
        aria-label="Open menu"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path
            d="M4 7H20M4 12H20M4 17H20"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
      </button>
    </div>
  </div>

  <!-- MOBILE DROPDOWN  -->
  @if (mobileOpen) {
    <div
      class="mt-3 rounded-2xl border border-white/10 bg-white/5 backdrop-blur px-4 py-4 shadow-[0_12px_60px_rgba(0,0,0,0.45)] md:hidden"
    >
      <nav class="flex flex-col gap-2" aria-label="Mobile primary">
        <a
          routerLink="/"
          (click)="closeMobile()"
          [routerLinkActiveOptions]="{ exact: true }"
          routerLinkActive="!text-[var(--text-primary)] bg-white/5"
          class="rounded-xl px-3 py-3 font-dm font-light text-sm tracking-wide
                 text-[var(--text-secondary)] hover:text-[var(--text-primary)] transition"
        >
          POCETNA
        </a>

        <a
          routerLink="/reservations"
          (click)="closeMobile()"
          routerLinkActive="!text-[var(--text-primary)] bg-white/5"
          class="rounded-xl px-3 py-3 font-dm font-light text-sm tracking-wide
                 text-[var(--text-secondary)] hover:text-[var(--text-primary)] transition"
        >
          REZERVACIJE
        </a>

        <a
          routerLink="/venues"
          (click)="closeMobile()"
          routerLinkActive="!text-[var(--text-primary)] bg-white/5"
          class="rounded-xl px-3 py-3 font-dm font-light text-sm tracking-wide
                 text-[var(--text-secondary)] hover:text-[var(--text-primary)] transition"
        >
          LOKALI
        </a>
      </nav>
    </div>
  }
</header>
