@if (authService.isAuthenticated()) {
  <app-auth-navbar></app-auth-navbar>
} @else {
  <app-public-navbar></app-public-navbar>
}

<main class="mx-auto max-w-8xl px-15 py-8">
  <router-outlet></router-outlet>
  <app-venue-card title="Sloga" category="Club" location="Sarajevske Brigade 23"></app-venue-card>

  
  <div class="flex gap-10 mt-20 mb-20">
      <app-button-component variant="outline" size="md" fullWidth>
      Vidi detaljno
      </app-button-component>
      <app-button-component variant="filled" size="md" fullWidth>
      Rezervisi
      </app-button-component>
      <app-button-component variant="special" size="md" fullWidth>
      Special
      </app-button-component>

      <app-toast variant="success">
  Rezervacija uspješno kreirana 
</app-toast>

<app-toast variant="error">
  Greška prilikom rezervacije
</app-toast>

<app-toast variant="warning">
  Popuni sva obavezna polja
</app-toast>





  </div>

  <div class="flex gap-20">
      <app-reservation-card
    venueName="Viking Pub"
    category="Pub"
    status="ACCEPTED"
    dateLabel="Petak - 19.02.2023"
    timeLabel="20:00"
  ></app-reservation-card>

  <app-reservation-card
    venueName="Club Noir"
    category="Club"
    status="PENDING"
    dateLabel="Subota - 20.02.2023"
    timeLabel="22:30"
  ></app-reservation-card>

  <app-reservation-card
    venueName="Lounge 44"
    category="Lounge"
    status="REJECTED"
    dateLabel="Nedjelja - 21.02.2023"
    timeLabel="21:00"
  ></app-reservation-card>
  </div>




  

  </main> 
  
  <app-reservation-modal
    [open]="open"
    venueName="Viking Pub"
    (close)="open = false"
  ></app-reservation-modal>
