<app-loading-bar></app-loading-bar>

@if (authService.authenticated()) {
  <app-auth-navbar></app-auth-navbar>
} @else {
  <app-public-navbar></app-public-navbar>
}

<app-toast-host></app-toast-host>

<main class="mx-auto max-w-8xl px-6 py-8">
  <router-outlet></router-outlet>

  <section class="mt-8 rounded-2xl border border-white/10 bg-white/5 p-5">
    <h2 class="text-white font-semibold text-sm mb-3">Dev tests</h2>

    <div class="flex items-center gap-3">
      <button
        class="px-4 py-2 rounded-xl bg-white/10 hover:bg-white/15 text-white text-sm"
        (click)="loadVenues()"
      >
        Load venues
      </button>

      <button
        class="px-4 py-2 rounded-xl bg-white/10 hover:bg-white/15 text-white text-sm"
        (click)="testError()"
      >
        Trigger error toast
      </button>

      @if (loading) {
        <span class="text-white/60 text-sm">Loading...</span>
      }
    </div>

    @if (!loading && venues.length) {
      <div class="mt-4 text-white/70 text-sm">
        Loaded: <span class="text-white">{{ venues.length }}</span> venues
      </div>
    }
  </section>
</main>
