<div
  class="w-110 rounded-3xl overflow-hidden
         bg-[#1E293B]/80 backdrop-blur-xl
         border border-white/12
         shadow-[0_18px_50px_-18px_rgba(0,0,0,0.75),inset_0_1px_0_rgba(255,255,255,0.06)]
         transition-all duration-300
         hover:-translate-y-0.5 hover:border-white/20 hover:shadow-[0_26px_70px_-26px_rgba(0,0,0,0.85),inset_0_1px_0_rgba(255,255,255,0.07)]"
>
  <div class="p-5">
    <!-- Top row: status badge left, category pill right -->
    <div class="flex items-center justify-between">
      <app-badge [variant]="statusVariant">
        {{ statusText }}
      </app-badge>

      <span
        class="text-white/60 text-[12px] px-3 py-1 rounded-full
               bg-white/5 border border-white/10 backdrop-blur-md"
      >
        {{ category }}
      </span>
    </div>

    <!-- Venue name -->
    <div class="mt-4 text-white text-[32px] font-semibold leading-[1.05] tracking-tight">
      {{ venueName }}
    </div>

    <!-- Info rows -->
    <div class="mt-4 space-y-2">
      <!-- Date -->
      <div class="flex items-center gap-3 text-white/75 text-[14px]">
        <!-- Calendar icon -->
        <svg
          class="w-5 h-5 text-white/60"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="M8 2v3M16 2v3M3.5 9h17"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
          <path
            d="M6 5h12a3 3 0 0 1 3 3v11a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3Z"
            stroke="currentColor"
            stroke-width="2"
            stroke-linejoin="round"
          />
        </svg>

        <span>{{ dateLabel }}</span>
      </div>

      <!-- Time -->
      <div class="flex items-center gap-3 text-white/75 text-[14px]">
        <!-- Clock icon -->
        <svg
          class="w-5 h-5 text-white/60"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="M12 22a10 10 0 1 0-10-10 10 10 0 0 0 10 10Z"
            stroke="currentColor"
            stroke-width="2"
          />
          <path
            d="M12 6v6l4 2"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>

        <span>{{ timeLabel }}</span>
      </div>
    </div>

    <!-- Bottom row -->
    <div class="mt-6 flex justify-end">
      <app-button-component variant="outline" size="md">
        Detalji
      </app-button-component>
    </div>
  </div>
</div>
