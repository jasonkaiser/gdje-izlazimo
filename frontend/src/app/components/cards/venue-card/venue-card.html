<div
  class="w-full h-[350px] rounded-3xl overflow-hidden border border-white/10 bg-[#0B1220] relative group shadow-lg hover:shadow-2xl transition-all duration-300 cursor-pointer"
  (click)="onViewDetails()"
>
  <!-- Background image -->
  <img
    [src]="imageUrl"
    [alt]="title"
    class="absolute inset-0 w-full h-full object-cover scale-100 group-hover:scale-105 transition-transform duration-500"
  />

  <!-- Better overlay: gradient + soft blur layer -->
  <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/35 to-black/10"></div>

  <!-- Content -->
  <div class="relative flex flex-col h-full">
    <!-- Tag -->
    <app-badge variant="category" class="m-4"> {{ category }} </app-badge>

    <!-- Bottom info (glass) -->
  
    <div
  class="mt-auto mx-4 mb-4 rounded-2xl border border-white/10 bg-white/1 backdrop-blur-xl
         p-4 flex items-center justify-between gap-3"
>
  <div class="flex-1 min-w-0">
    <div class="text-white text-[22px] font-semibold leading-tight truncate">
      {{ title }}
    </div>
    <div class="text-white/60 text-[11px] truncate">
      {{ location }}
    </div>
    <div class="flex items-center mt-1 gap-1">
      <svg class="h-4.5 w-4.5 flex-shrink-0" viewBox="0 0 24 24" fill="rgba(251,191,36,0.9)">
        <path d="M11.48 3.499a.562.562 0 0 1 1.04 0l2.125 5.111a.563.563 0 0 0 .475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 0 0-.182.557l1.285 5.385a.562.562 0 0 1-.84.61l-4.725-2.885a.562.562 0 0 0-.586 0L6.982 20.54a.562.562 0 0 1-.84-.61l1.285-5.386a.562.562 0 0 0-.182-.557l-4.204-3.602a.562.562 0 0 1 .321-.988l5.518-.442a.563.563 0 0 0 .475-.345L11.48 3.5Z"/>
      </svg>
      @if (totalRatings > 0) {
        <span class="text-white text-sm font-bold">{{ averageRating | number:'1.1-1' }}</span>
        <span class="text-white/50 font-light text-[12px] ml-1">({{ totalRatings }})</span>
      } @else {
        <span class="text-white/40 text-[12px]">Nema ocjena</span>
      }
    </div>
  </div>

  <app-button-component
    variant="outline"
    size="sm"
    class="shrink-0"
    (click)="onViewDetails(); $event.stopPropagation()"
  >
    Pogledaj lokal
  </app-button-component>
</div>
  </div>
</div>
