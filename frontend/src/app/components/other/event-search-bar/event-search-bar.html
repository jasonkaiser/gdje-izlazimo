<div class="w-full flex justify-center">
  <div class="relative w-full max-w-[754px] max-sm:mx-[-24px]">
    <!-- Main pill -->
    <div
      class="flex items-center gap-3 rounded-full border border-white/5 bg-[#080808]
             shadow-[4px_3px_10px_3px_rgba(0,0,0,0.7)]
             px-2.5 py-2.5 sm:px-4 sm:py-3"
    >
      <!-- Input pill -->
      <div
        class="relative flex-1 rounded-full border border-white/10 h-[46px] flex items-center"
        style="background: rgba(255,255,255,0.03);"
      >
        <input
          type="text"
          class="w-full bg-transparent outline-none
                font-dm font-light text-[13px] sm:text-[14px]
                text-[var(--text-primary)]
                placeholder:text-white/40
                pl-5 pr-[72px]"
          placeholder="Pretraži događaje..."
          [(ngModel)]="query"
          (ngModelChange)="onQueryChange()"
          (keydown.enter)="onSearch()"
        />
        <!-- Search button -->
        <button
          type="button"
          (click)="onSearch()"
          class="absolute right-[0px] top-1/2 -translate-y-1/2
                 h-[45px] w-[65px] rounded-full
                 flex items-center justify-center
                 shadow-[0_0_86.94px_rgba(109,51,209,1),_0_0_43.47px_rgba(109,51,209,1)]
                 hover:shadow-none active:shadow-none
                 transition-shadow duration-300"
          style="background: radial-gradient(120% 900% at 42% -13%, #7C3AED 0%, #472187 100%);"
          aria-label="Search"
        >
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M11 19a8 8 0 1 1 0-16 8 8 0 0 1 0 16Z" stroke="white" stroke-width="2"/>
            <path d="M21 21l-4.3-4.3" stroke="white" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <!-- Divider -->
      <div class="h-10 w-px bg-white/10"></div>

      <!-- Desktop: Sortiraj -->
      <button
        type="button"
        (click)="toggleSort()"
        class="hidden sm:flex shrink-0 items-center justify-center gap-2
               rounded-full px-3 sm:px-4 h-[46px]
               font-dm font-light text-[13px] transition-all duration-200"
        [class]="sortOpen || hasActiveFilters()
          ? 'text-violet-300'
          : 'text-white/40 hover:text-[var(--text-primary)]'"
        aria-label="Sortiraj"
      >
        <span>Sortiraj</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" class="opacity-70 transition-transform duration-200"
             [style.transform]="sortOpen ? 'rotate(180deg)' : 'rotate(0deg)'">
          <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <!-- Mobile: Filters button -->
      <button
        type="button"
        (click)="toggleSort()"
        class="sm:hidden shrink-0 w-[52px] relative
               flex items-center justify-center
               rounded-full h-[46px]
               font-dm font-light text-[13px] transition-all duration-200"
        [class]="sortOpen || hasActiveFilters() ? 'text-violet-300' : 'text-white/40 hover:text-[var(--text-primary)]'"
        aria-label="Sortiraj"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" class="opacity-80">
          <path d="M4 6h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M7 6v0" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
          <path d="M4 12h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M12 12v0" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
          <path d="M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M17 18v0" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
        </svg>
        @if (hasActiveFilters()) {
          <span class="absolute top-2.5 right-2.5 h-1.5 w-1.5 rounded-full bg-violet-400"></span>
        }
      </button>
    </div>

    <!-- Sortiraj dropdown (desktop + mobile shared) -->
    @if (sortOpen) {
      <div class="absolute left-0 right-0 top-full mt-2 z-50
                  w-full sm:left-auto sm:right-0 sm:w-[220px]
                  rounded-4xl border border-white/5 bg-white/2 backdrop-blur
                  p-2 shadow-[4px_3px_10px_3px_rgba(0,0,0,0.7)]">
        @for (s of sorts; track s.value) {
          <button
            type="button"
            (click)="selectSort(s)"
            class="w-full text-left px-5 py-3 rounded-4xl font-dm font-light text-sm transition-all duration-150
                   flex items-center justify-between"
            [class]="selectedSort.value === s.value
              ? 'text-violet-300 bg-violet-500/[0.08]'
              : 'text-white/55 hover:bg-white/5 hover:text-white'"
          >
            {{ s.label }}
            @if (selectedSort.value === s.value) {
              <svg class="h-3 w-3 text-violet-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 13l4 4L19 7"/>
              </svg>
            }
          </button>
        }
      </div>
    }
  </div>
</div>
