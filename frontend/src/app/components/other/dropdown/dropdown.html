<div class="premium-dropdown-wrapper">
  <!-- Label -->
  @if (label) {
    <label class="font-dm text-[11px] tracking-[0.12em] uppercase text-white/50 pl-1 mb-2 block">
      {{ label }}
    </label>
  }

  <div class="premium-dropdown-container">
    <!-- Dropdown Button -->
    <button
      type="button"
      (click)="toggleDropdown($event)"
      [disabled]="disabled"
      class="premium-dropdown-button"
      [class.premium-dropdown-button--open]="isOpen"
      [class.premium-dropdown-button--error]="error"
      [class.premium-dropdown-button--disabled]="disabled"
    >
      <span 
        class="premium-dropdown-button__text"
        [class.premium-dropdown-button__text--placeholder]="!value"
      >
        {{ selectedLabel }}
      </span>
      
      <!-- Chevron -->
      <svg 
        class="premium-dropdown-button__chevron"
        [class.premium-dropdown-button__chevron--open]="isOpen"
        fill="none" 
        viewBox="0 0 24 24" 
        stroke="currentColor" 
        stroke-width="2"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
      </svg>
    </button>

    <!-- Dropdown Menu - Simple Absolute Positioning -->
    @if (isOpen) {
      <div 
        class="premium-dropdown-menu"
        [class.closing]="isClosing"
      >
        @for (opt of options; track opt.value) {
          <button
            type="button"
            class="premium-dropdown-option"
            [class.premium-dropdown-option--selected]="value === opt.value"
            (click)="selectOption(opt.value, $event)"
          >
            <span>{{ opt.label }}</span>
            
            @if (value === opt.value) {
              <svg class="premium-dropdown-option__check" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
              </svg>
            }
          </button>
        }
      </div>
    }
  </div>

  <!-- Error Message -->
  @if (error) {
    <p class="mt-1.5 text-[11px] text-red-400/90 pl-1">
      {{ error }}
    </p>
  }
</div>
