<!-- confirm-modal.html - PREMIUM REDESIGN -->

<!-- Modal backdrop -->
<div
  class="modal-backdrop fixed inset-0 z-[9999] flex items-end sm:items-center justify-center p-0 sm:p-6"
  style="background: rgba(0,0,0,0.80); backdrop-filter: blur(12px);"
  (click)="onCancel()"
>
  <!-- Modal shell -->
  <article
    class="modal-shell animate-slide-up relative w-full sm:max-w-[480px] overflow-hidden rounded-t-3xl sm:rounded-3xl
           bg-[#090909] border border-white/10
           shadow-[0_20px_80px_rgba(0,0,0,0.90)]
           px-7 sm:px-8 py-6 sm:py-7"
    (click)="$event.stopPropagation()"
  >
    <!-- LEFT ACCENT (dynamic color based on variant) -->
    <span
      class="pointer-events-none absolute left-0 top-3 bottom-3 w-[2px] rounded-full opacity-85"
      [ngStyle]="getAccentGradient()"
    ></span>

    <!-- Top-left corner accents -->
    <span
      class="pointer-events-none absolute left-0 top-0 h-[44px] w-[150px] rounded-tl-3xl
             border-l-[2px] border-t-[2px] opacity-20"
      [style.border-color]="getAccentColor()"
      style="mask-image: radial-gradient(circle at top left, black 25%, transparent 75%);"
    ></span>

    <span
      class="pointer-events-none absolute left-0 bottom-0 h-[44px] w-[150px] rounded-bl-3xl
             border-l-[2px] border-b-[2px] opacity-20"
      [style.border-color]="getAccentColor()"
      style="mask-image: radial-gradient(circle at bottom left, black 25%, transparent 75%);"
    ></span>

    <!-- Subtle hover sheen -->
    <span
      class="pointer-events-none absolute inset-0
             bg-[linear-gradient(120deg,rgba(255,255,255,0.04)_0%,rgba(255,255,255,0)_35%,rgba(255,255,255,0.02)_70%,rgba(255,255,255,0)_100%)]"
    ></span>

    <!-- Radial highlight (dynamic color) -->
    <span
      class="pointer-events-none absolute -top-16 -right-16 h-56 w-56 rounded-full opacity-40 blur-3xl"
      [ngStyle]="getRadialHighlight()"
    ></span>

    <!-- Header: Icon Badge + Close -->
    <div class="relative flex items-start justify-between gap-3 mb-6">
      <!-- ICON BADGE -->
      <div
        class="flex h-12 w-12 sm:h-14 sm:w-14 items-center justify-center rounded-2xl transition-all duration-300"
        [ngStyle]="getIconBadgeStyle()"
      >
        <!-- Danger Icon -->
        @if (variant === 'danger') {
          <svg class="h-6 w-6 sm:h-7 sm:w-7" [ngClass]="getIconColor()" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/>
          </svg>
        }
        <!-- Warning Icon -->
        @if (variant === 'warning') {
          <svg class="h-6 w-6 sm:h-7 sm:w-7" [ngClass]="getIconColor()" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
          </svg>
        }
        <!-- Info Icon -->
        @if (variant === 'info') {
          <svg class="h-6 w-6 sm:h-7 sm:w-7" [ngClass]="getIconColor()" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
        }
      </div>

      <!-- Close button -->
      <button
        type="button"
        (click)="onCancel()"
        class="flex h-8 w-8 items-center justify-center rounded-full
               border border-white/10 text-white/40
               transition-all duration-300
               hover:bg-white/10 hover:text-white/80 hover:border-white/20"
        aria-label="Zatvori"
      >
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- Title & Message -->
    <div class="relative mt-4">
      <h2 class="font-sora font-semibold text-[24px] sm:text-[28px] tracking-[0.02em] text-white leading-tight mb-3">
        {{ title }}
      </h2>

      <p class="font-dm font-light text-[13px] sm:text-[14px] tracking-[0.01em] text-white/65 leading-relaxed whitespace-pre-line">
        {{ message }}
      </p>
    </div>

    <!-- Action Buttons -->
    <div class="relative mt-8 flex flex-col-reverse sm:flex-row items-stretch sm:items-center gap-3">
      <!-- Cancel Button -->
      <button
        type="button"
        (click)="onCancel()"
        class="flex-1 rounded-xl bg-white/5 border border-white/15
               px-5 py-3
               font-dm font-normal text-[12px] tracking-[0.08em] uppercase text-white/60
               transition-all duration-300
               hover:text-white/85 hover:bg-white/10 hover:border-white/25
               hover:-translate-y-px"
      >
        {{ cancelText }}
      </button>

      <!-- Confirm Button -->
      <button
        type="button"
        (click)="onConfirm()"
        class="flex-1 rounded-xl border
               px-5 py-3
               font-dm font-medium text-[12px] tracking-[0.08em] uppercase
               transition-all duration-300
               hover:-translate-y-px"
        [ngClass]="getConfirmButtonClass()"
      >
        {{ confirmText }}
      </button>
    </div>
  </article>
</div>
