<div class="fixed inset-0 z-[9999] flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fade-in" (click)="onCancel()">
  <div class="relative w-full max-w-md rounded-2xl bg-[#0A0A0A] border border-white/10 shadow-2xl animate-slide-down" (click)="$event.stopPropagation()">
    
    <!-- Icon & Title -->
    <div class="px-6 pt-6 pb-4 text-center">
      <!-- Icon -->
      <div class="mx-auto mb-4 h-14 w-14 rounded-full flex items-center justify-center"
           [class.bg-red-500/10]="variant === 'danger'"
           [class.border-red-500/20]="variant === 'danger'"
           [class.bg-yellow-500/10]="variant === 'warning'"
           [class.border-yellow-500/20]="variant === 'warning'"
           [class.bg-blue-500/10]="variant === 'info'"
           [class.border-blue-500/20]="variant === 'info'"
           class="border">
        @if (variant === 'danger') {
          <svg class="h-7 w-7" [ngClass]="getIconColor()" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
          </svg>
        }
        @if (variant === 'warning') {
          <svg class="h-7 w-7" [ngClass]="getIconColor()" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
          </svg>
        }
        @if (variant === 'info') {
          <svg class="h-7 w-7" [ngClass]="getIconColor()" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
        }
      </div>

      <!-- Title -->
      <h3 class="font-sora text-[20px] font-semibold text-white/95 mb-2">
        {{ title }}
      </h3>

      <!-- Message -->
      <p class="font-dm text-[14px] text-white/70 leading-relaxed whitespace-pre-line">
        {{ message }}
      </p>
    </div>

    <!-- Actions -->
    <div class="flex items-center gap-3 px-6 pb-6">
      <button
        type="button"
        (click)="onCancel()"
        class="flex-1 h-11 px-6 rounded-xl border border-white/10 bg-white/[0.03] font-dm text-[13px] tracking-[0.08em] uppercase text-white/70 transition-all duration-200 hover:bg-white/[0.08] hover:text-white"
      >
        {{ cancelText }}
      </button>
      <button
        type="button"
        (click)="onConfirm()"
        class="flex-1 h-11 px-6 rounded-xl border font-dm text-[13px] tracking-[0.08em] uppercase transition-all duration-200"
        [ngClass]="getButtonClass()"
      >
        {{ confirmText }}
      </button>
    </div>

  </div>
</div>
