<div class="fixed inset-0 z-[9999] flex items-center justify-center p-6">
    <div class="absolute inset-0 bg-black/60 pointer-events-none" (click)="onClose()" aria-hidden="true"></div>

    <div
      class="relative z-10 w-full max-w-[420px] rounded-3xl overflow-hidden
             border border-white/10 bg-[#0B1220]/85 backdrop-blur-2xl
             shadow-[0_30px_90px_-40px_rgba(0,0,0,0.9)]
             px-6 py-6"
    >
      <div class="flex items-start justify-between">
        <h2 class="text-white/80 text-[30px] font-semibold tracking-tight">
          {{ venueName }}
        </h2>

        <button
          type="button"
          class="text-white/50 hover:text-white/80 transition text-[22px] leading-none px-2"
          (click)="onClose()"
          aria-label="Close"
        >
          ×
        </button>
      </div>

      <form class="mt-5 space-y-4" [formGroup]="form" (ngSubmit)="onSubmit() ">
        <!-- Use Dropdown Component -->
        <app-dropdown
          label="Vrsta Stola"
          placeholder="Izaberi vrstu stola"
          [options]="tableTypeSelectOptions"
          [error]="tableTypeError"
          formControlName="tableTypeId"
        >
          <svg rightIcon class="w-5 h-5" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M7 10V7a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M6 12h12v4H6v-4Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            <path d="M7 20v-4M17 20v-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </app-dropdown>

        <!-- Use Dropdown Component -->
        <app-dropdown
          label="Broj Ljudi"
          placeholder="2-8"
          [options]="peopleSelectOptions"
          [error]="peopleCountError"
          formControlName="numberOfPeople"
        >
          <svg rightIcon class="w-5 h-5" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M16 11a4 4 0 1 0-8 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M4 20a6 6 0 0 1 16 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </app-dropdown>

          <app-input
          label="Telefon"
          kind="input"
          placeholder="+38765123123"
          formControlName="phone"
        >
          <svg rightIcon class="w-5 h-5" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 17.3l-5.2 3 1.4-5.9L3.6 10l6.1-.5L12 4l2.3 5.5 6.1.5-4.6 4.4 1.4 5.9-5.2-3Z"
                  stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          </svg>
        </app-input>

        <app-input
          label="Datum"
          kind="input"
          type="date"
          [error]="dateError"
          formControlName="reservationDate"
        >
          <svg rightIcon class="w-5 h-5" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M8 2v3M16 2v3M3.5 9h17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M6 5h12a3 3 0 0 1 3 3v11a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3Z"
                  stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          </svg>
        </app-input>

           <app-input
          label="Vrijeme"
          kind="input"
          type="time"
          [error]="timeError"
          formControlName="reservationTime"
        >
          <svg rightIcon class="w-5 h-5" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M8 2v3M16 2v3M3.5 9h17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M6 5h12a3 3 0 0 1 3 3v11a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3Z"
                  stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          </svg>
        </app-input>

        <app-input
          label="Specijalni zahtjevi"
          kind="textarea"
          placeholder="Text"
          formControlName="specialRequests"
        >
          <svg rightIcon class="w-5 h-5" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 17.3l-5.2 3 1.4-5.9L3.6 10l6.1-.5L12 4l2.3 5.5 6.1.5-4.6 4.4 1.4 5.9-5.2-3Z"
                  stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          </svg>
        </app-input>

        <div class="pt-4">
          <app-button-component type="submit" variant="filled" size="md" fullWidth>
            Rezerviši
          </app-button-component>
   
        </div>
      </form>
    </div>
  </div>
