<div class="modal-backdrop" [class.is-closing]="isClosing" (click)="onClose()">
  <div class="modal-shell animate-slide-up" [class.is-closing]="isClosing" (click)="$event.stopPropagation()">
    <div class="modal-card">

      <!-- HEADER -->
      <div class="modal-header">
        <div class="flex items-start justify-between gap-4">
          <div class="min-w-0">
            <p class="font-dm text-[10px] tracking-[0.16em] uppercase text-white/35 mb-1">
              Rezervacija
            </p>
            <h2 class="font-sora font-semibold text-[28px] sm:text-[34px] tracking-[0.02em] text-white leading-tight truncate">
              {{ venueName }}
            </h2>
            <p class="font-dm font-light text-[13px] tracking-[0.02em] text-white/60 mt-2">
              Unesi detalje rezervacije
            </p>
          </div>

          <button type="button" (click)="onClose()" class="modal-close" aria-label="Close">
            <svg class="h-5 w-5 text-white/60" viewBox="0 0 24 24" fill="none">
              <path d="M6 18L18 6M6 6l12 12" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- BODY -->
      <div class="modal-body">
        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="relative space-y-4">

          <!-- Table type -->
          <div inView (inViewChange)="setInView('table', $event)" class="" [class.in]="inView.table">
            <label class="font-dm text-[10px] tracking-[0.14em] uppercase text-white/40">Vrsta stola</label>
            <div class="mt-2">
              <app-dropdown
                class="modal-dropdown"
                placeholder="Izaberi vrstu stola"
                [options]="tableTypeSelectOptions"
                [error]="tableTypeError"
                formControlName="tableTypeId"
              >
                <svg rightIcon class="w-4 h-4" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M7 10V7a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                  <path d="M6 12h12v4H6v-4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                  <path d="M7 20v-4M17 20v-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
              </app-dropdown>
            </div>
          </div>

          <!-- People -->
          <div inView (inViewChange)="setInView('people', $event)" class="" [class.in]="inView.people">
            <label class="font-dm text-[10px] tracking-[0.14em] uppercase text-white/40">Broj osoba</label>
            <div class="mt-2">
              <app-dropdown
                class="modal-dropdown"
                placeholder="Izaberi broj osoba"
                [options]="peopleSelectOptions"
                [error]="peopleCountError"
                formControlName="numberOfPeople"
              >
                <svg rightIcon class="w-4 h-4" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M16 11a4 4 0 1 0-8 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                  <path d="M4 20a6 6 0 0 1 16 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
              </app-dropdown>
            </div>
          </div>

          <!-- Phone -->
          <div inView (inViewChange)="setInView('phone', $event)" class="reveal" [class.in]="inView.phone">
            <label class="font-dm text-[10px] tracking-[0.14em] uppercase text-white/40">Telefon</label>
            <div class="mt-2">
              <app-input kind="input" placeholder="+38765123123" formControlName="phone">
                <svg rightIcon class="w-4 h-4" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8Z"
                        stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </app-input>
            </div>
          </div>

          <!-- Date + Time -->
          <div inView (inViewChange)="setInView('dateTime', $event)" class="reveal" [class.in]="inView.dateTime">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

              <!-- DATE -->
              <div>
                <label class="font-dm text-[10px] tracking-[0.14em] uppercase text-white/40">Datum</label>
                <div class="mt-2 date-time-wrap">
                  <app-input
                    #dateInput
                    kind="input"
                    type="date"
                    [error]="dateError"
                    formControlName="reservationDate"
                  >
                    <button
                      rightIcon
                      type="button"
                      class="picker-btn"
                      (click)="openDatePicker(); $event.preventDefault(); $event.stopPropagation()"
                      aria-label="Odaberi datum"
                    >
                      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M8 2v3M16 2v3M3.5 9h17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                        <path d="M6 5h12a3 3 0 0 1 3 3v11a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3Z"
                              stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                      </svg>
                    </button>
                  </app-input>
                </div>
              </div>

              <!-- TIME -->
              <div>
                <label class="font-dm text-[10px] tracking-[0.14em] uppercase text-white/40">Vrijeme</label>
                <div class="mt-2 date-time-wrap">
                  <app-input
                    #timeInput
                    kind="input"
                    type="time"
                    [error]="timeError"
                    formControlName="reservationTime"
                  >
                    <button
                      rightIcon
                      type="button"
                      class="picker-btn"
                      (click)="openTimePicker(); $event.preventDefault(); $event.stopPropagation()"
                      aria-label="Odaberi vrijeme"
                    >
                      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/>
                        <path d="M12 7v5l3 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                      </svg>
                    </button>
                  </app-input>
                </div>
              </div>

            </div>
          </div>

          <!-- Special requests -->
          <div inView (inViewChange)="setInView('note', $event)" class="reveal" [class.in]="inView.note">
            <label class="font-dm text-[10px] tracking-[0.14em] uppercase text-white/40">
              Napomena <span class="text-white/25 normal-case tracking-normal">(opcionalno)</span>
            </label>
            <div class="mt-2">
              <app-input kind="textarea" placeholder="Posebni zahtjevi, alergije, prilike..." formControlName="specialRequests">
                <svg rightIcon class="w-4 h-4" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"
                        stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </app-input>
            </div>
          </div>

          <div class="h-2"></div>
          <button type="submit" class="hidden" aria-hidden="true"></button>
        </form>
      </div>

      <!-- FOOTER -->
      <div inView (inViewChange)="setInView('footer', $event)" class="modal-footer reveal" [class.in]="inView.footer">
      <button
        type="button"
        (click)="onClose()"
        class="
          px-5 py-2.5
          rounded-xl
          border border-white/15
          bg-white/5
          text-white/70
          text-sm font-medium
          transition-all duration-200
          hover:bg-white/10
          hover:border-white/25
          hover:text-white
          active:scale-[0.97]
          focus:outline-none focus:ring-2 focus:ring-white/10
        "
      >
        Zatvori
      </button>


        <div class="footer-primary">
          <app-button-component variance="filled" size="md" (click)="onSubmit()">
            Potvrdi
          </app-button-component>
        </div>
      </div>

    </div>
  </div>
</div>
