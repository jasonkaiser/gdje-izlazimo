<div class="fixed inset-0 z-[9999] flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fade-in" (click)="onClose()">
  <div class="relative w-full max-w-2xl rounded-2xl bg-[#0A0A0A] border border-white/10 shadow-2xl animate-slide-down max-h-[90vh] flex flex-col" (click)="$event.stopPropagation()">
    
    <!-- Header -->
    <div class="flex items-center justify-between px-6 py-5 border-b border-white/10 flex-shrink-0">
      <h3 class="font-sora text-[20px] font-semibold text-white/95">
        {{ mode === 'create' ? 'Novi Lokal' : 'Uredi Lokal' }}
      </h3>
      <button
        (click)="onClose()"
        class="h-8 w-8 rounded-lg hover:bg-white/5 flex items-center justify-center transition-colors"
      >
        <svg class="h-5 w-5 text-white/60" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- Form (Scrollable) -->
    <form (ngSubmit)="onSubmit()" class="flex-1 overflow-y-auto">
      <div class="p-6 space-y-5">
        
        <!-- Name -->
        <div>
          <label class="font-dm text-[12px] tracking-[0.08em] uppercase text-white/60 mb-2 block">
            Naziv Lokala *
          </label>
          <input
            type="text"
            [(ngModel)]="formData.name"
            name="name"
            required
            placeholder="npr. Caffe Bar Central"
            class="w-full h-12 px-4 rounded-xl border border-white/10 bg-white/[0.03] font-dm text-[14px] text-white placeholder-white/30 transition-all duration-200 focus:outline-none focus:border-purple-500/40 focus:bg-white/[0.05] hover:border-white/15"
          />
        </div>

        <!-- Description -->
        <div>
          <label class="font-dm text-[12px] tracking-[0.08em] uppercase text-white/60 mb-2 block">
            Opis
          </label>
          <textarea
            [(ngModel)]="formData.description"
            name="description"
            rows="3"
            placeholder="Kratak opis lokala..."
            class="w-full px-4 py-3 rounded-xl border border-white/10 bg-white/[0.03] font-dm text-[14px] text-white placeholder-white/30 transition-all duration-200 focus:outline-none focus:border-purple-500/40 focus:bg-white/[0.05] hover:border-white/15 resize-none"
          ></textarea>
        </div>

        <!-- Address & Phone Row -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <!-- Address -->
          <div>
            <label class="font-dm text-[12px] tracking-[0.08em] uppercase text-white/60 mb-2 block">
              Adresa *
            </label>
            <input
              type="text"
              [(ngModel)]="formData.addressName"
              name="addressName"
              required
              placeholder="npr. Ferhadija 25, Sarajevo"
              class="w-full h-12 px-4 rounded-xl border border-white/10 bg-white/[0.03] font-dm text-[14px] text-white placeholder-white/30 transition-all duration-200 focus:outline-none focus:border-purple-500/40 focus:bg-white/[0.05] hover:border-white/15"
            />
          </div>

          <!-- Phone -->
          <div>
            <label class="font-dm text-[12px] tracking-[0.08em] uppercase text-white/60 mb-2 block">
              Telefon *
            </label>
            <input
              type="tel"
              [(ngModel)]="formData.phone"
              name="phone"
              required
              placeholder="npr. +387 33 123 456"
              class="w-full h-12 px-4 rounded-xl border border-white/10 bg-white/[0.03] font-dm text-[14px] text-white placeholder-white/30 transition-all duration-200 focus:outline-none focus:border-purple-500/40 focus:bg-white/[0.05] hover:border-white/15"
            />
          </div>
        </div>

        <!-- Venue Type & Status Row -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <!-- Venue Type -->
          <div>
            <label class="font-dm text-[12px] tracking-[0.08em] uppercase text-white/60 mb-2 block">
              Tip Lokala *
            </label>
            <select
              [(ngModel)]="formData.venueType"
              name="venueType"
              required
              class="w-full h-12 px-4 rounded-xl border border-white/10 bg-white/[0.03] font-dm text-[14px] text-white transition-all duration-200 focus:outline-none focus:border-purple-500/40 focus:bg-white/[0.05] hover:border-white/15 cursor-pointer"
            >
              <option [value]="VenueCategory.CLUB" class="bg-[#0A0A0A]">{{ getCategoryLabel(VenueCategory.CLUB) }}</option>
              <option [value]="VenueCategory.PUB" class="bg-[#0A0A0A]">{{ getCategoryLabel(VenueCategory.PUB) }}</option>
              <option [value]="VenueCategory.LOUNGE" class="bg-[#0A0A0A]">{{ getCategoryLabel(VenueCategory.LOUNGE) }}</option>
              <option [value]="VenueCategory.RESTAURANT" class="bg-[#0A0A0A]">{{ getCategoryLabel(VenueCategory.RESTAURANT) }}</option>
            </select>
          </div>

          <!-- Active Status -->
          <div>
            <label class="font-dm text-[12px] tracking-[0.08em] uppercase text-white/60 mb-2 block">
              Status
            </label>
            <div class="flex items-center h-12 px-4 rounded-xl border border-white/10 bg-white/[0.03]">
              <label class="flex items-center justify-between w-full cursor-pointer">
                <span class="font-dm text-[14px] text-white/80">Aktivan</span>
                <button
                  type="button"
                  (click)="formData.isActive = !formData.isActive"
                  class="relative inline-flex h-7 w-12 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-all duration-200 ease-in-out focus:outline-none hover:scale-105"
                  [class.bg-green-500/90]="formData.isActive"
                  [class.bg-white/15]="!formData.isActive"
                  role="switch"
                >
                  <span 
                    class="pointer-events-none inline-block h-6 w-6 transform rounded-full bg-white shadow-lg ring-0 transition duration-200 ease-in-out"
                    [class.translate-x-5]="formData.isActive"
                    [class.translate-x-0]="!formData.isActive"
                  ></span>
                </button>
              </label>
            </div>
          </div>
        </div>

        <!-- Coordinates Row -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <!-- Latitude -->
          <div>
            <label class="font-dm text-[12px] tracking-[0.08em] uppercase text-white/60 mb-2 block">
              Latitude *
            </label>
            <input
              type="number"
              [(ngModel)]="formData.latitude"
              name="latitude"
              required
              step="0.0001"
              placeholder="43.8563"
              [disabled]="mode === 'edit'"
              class="w-full h-12 px-4 rounded-xl border border-white/10 bg-white/[0.03] font-dm text-[14px] text-white placeholder-white/30 transition-all duration-200 focus:outline-none focus:border-purple-500/40 focus:bg-white/[0.05] hover:border-white/15 disabled:opacity-50 disabled:cursor-not-allowed"
            />
          </div>

          <!-- Longitude -->
          <div>
            <label class="font-dm text-[12px] tracking-[0.08em] uppercase text-white/60 mb-2 block">
              Longitude *
            </label>
            <input
              type="number"
              [(ngModel)]="formData.longitude"
              name="longitude"
              required
              step="0.0001"
              placeholder="18.4131"
              [disabled]="mode === 'edit'"
              class="w-full h-12 px-4 rounded-xl border border-white/10 bg-white/[0.03] font-dm text-[14px] text-white placeholder-white/30 transition-all duration-200 focus:outline-none focus:border-purple-500/40 focus:bg-white/[0.05] hover:border-white/15 disabled:opacity-50 disabled:cursor-not-allowed"
            />
          </div>
        </div>

        <!-- Venue Owner (Create mode only) -->
        @if (mode === 'create') {
          <div>
            <label class="font-dm text-[12px] tracking-[0.08em] uppercase text-white/60 mb-2 block">
              Vlasnik Lokala *
            </label>
            @if (isLoadingOwners) {
              <div class="w-full h-12 px-4 rounded-xl border border-white/10 bg-white/[0.03] flex items-center">
                <svg class="animate-spin h-4 w-4 text-white/40" fill="none" viewBox="0 0 24 24">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span class="ml-3 font-dm text-[13px] text-white/50">Učitavanje vlasnika...</span>
              </div>
            } @else {
              <select
                [(ngModel)]="formData.venueOwnerId"
                name="venueOwnerId"
                required
                class="w-full h-12 px-4 rounded-xl border border-white/10 bg-white/[0.03] font-dm text-[14px] text-white transition-all duration-200 focus:outline-none focus:border-purple-500/40 focus:bg-white/[0.05] hover:border-white/15 cursor-pointer"
              >
                <option value="" class="bg-[#0A0A0A]">Izaberi vlasnika...</option>
                @for (owner of venueOwners; track owner.id) {
                  <option [value]="owner.id" class="bg-[#0A0A0A]">{{ owner.name }} ({{ owner.email }})</option>
                }
              </select>
            }
          </div>
        }

        <!-- Note about coordinates in edit mode -->
        @if (mode === 'edit') {
          <div class="rounded-xl bg-blue-500/5 border border-blue-500/20 px-4 py-3">
            <div class="flex gap-3">
              <svg class="h-5 w-5 text-blue-400 flex-shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
              </svg>
              <div>
                <p class="font-dm text-[13px] text-blue-400/90 mb-1">Napomena</p>
                <p class="font-dm text-[12px] text-blue-400/70 leading-relaxed">
                  Koordinate (latitude/longitude) se ne mogu mijenjati nakon kreiranja lokala.
                </p>
              </div>
            </div>
          </div>
        }

      </div>

      <!-- Actions -->
      <div class="flex items-center justify-end gap-3 px-6 py-5 border-t border-white/10 flex-shrink-0">
        <button
          type="button"
          (click)="onClose()"
          [disabled]="isSubmitting"
          class="h-11 px-6 rounded-xl border border-white/10 bg-white/[0.03] font-dm text-[13px] tracking-[0.08em] uppercase text-white/70 transition-all duration-200 hover:bg-white/[0.08] hover:text-white disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Otkaži
        </button>
        <button
          type="submit"
          [disabled]="isSubmitting || !formData.name.trim() || !formData.addressName.trim() || !formData.phone.trim() || (mode === 'create' && !formData.venueOwnerId)"
          class="h-11 px-6 rounded-xl border border-purple-500/30 bg-purple-500/10 font-dm text-[13px] tracking-[0.08em] uppercase text-purple-300 transition-all duration-200 hover:bg-purple-500/15 hover:border-purple-500/40 disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2"
        >
          @if (isSubmitting) {
            <svg class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
          }
          {{ mode === 'create' ? 'Kreiraj' : 'Sačuvaj' }}
        </button>
      </div>
    </form>

  </div>
</div>
