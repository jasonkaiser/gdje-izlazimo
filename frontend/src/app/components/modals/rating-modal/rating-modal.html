<div
  class="fixed inset-0 z-[70] flex items-end sm:items-center justify-center p-0 sm:p-4 modal-backdrop"
  (click)="close.emit()"
>
  <div class="absolute inset-0 bg-black/70 backdrop-blur-md"></div>

  <div
    class="relative z-10 w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl border border-white/[0.10] p-7 sm:p-8 modal-panel"
    style="background: rgba(10,8,20,0.98);"
    (click)="$event.stopPropagation()"
  >
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-2/3 h-px"
      style="background: linear-gradient(90deg, transparent, rgba(124,58,237,0.5), transparent);"></div>

    <div class="sm:hidden w-10 h-1 rounded-full bg-white/20 mx-auto mb-6"></div>

    <div class="flex items-start justify-between mb-6">
      <div>
        <p class="font-dm text-[10px] tracking-[0.2em] uppercase text-white/25 mb-0.5">Ocijeni posjetu</p>
        <h3 class="font-sora font-bold text-[20px] tracking-[-0.02em] text-white/90">{{ venueName() }}</h3>
      </div>
      <button type="button" (click)="close.emit()"
        class="h-9 w-9 rounded-xl border border-white/[0.08] bg-white/[0.04] flex items-center justify-center
               text-white/40 hover:text-white/80 hover:border-white/20 transition-all duration-200">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <div class="flex items-center justify-center gap-2 mb-6">
      @for (n of [1,2,3,4,5]; track n) {
        <button
          type="button"
          (mouseenter)="hoverStar(n)"
          (mouseleave)="clearHover()"
          (click)="selectStar(n)"
          class="transition-all duration-150 hover:scale-110 active:scale-95"
        >
          <svg class="h-10 w-10 transition-colors duration-150"
               viewBox="0 0 24 24"
               [style.fill]="isActive(n) ? 'rgba(250,204,21,1)' : 'rgba(255,255,255,0.08)'"
               [style.filter]="isActive(n) ? 'drop-shadow(0 0 8px rgba(250,204,21,0.5))' : 'none'">
            <path d="M11.48 3.499a.562.562 0 0 1 1.04 0l2.125 5.111a.563.563 0 0 0 .475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 0 0-.182.557l1.285 5.385a.562.562 0 0 1-.84.61l-4.725-2.885a.562.562 0 0 0-.586 0L6.982 20.54a.562.562 0 0 1-.84-.61l1.285-5.386a.562.562 0 0 0-.182-.557l-4.204-3.602a.562.562 0 0 1 .321-.988l5.518-.442a.563.563 0 0 0 .475-.345L11.48 3.5Z"/>
          </svg>
        </button>
      }
    </div>

    @if (selectedStar() > 0) {
      <p class="text-center font-dm text-[12px] text-white/40 mb-5">
        {{ selectedStar() === 1 ? 'Loše' : selectedStar() === 2 ? 'Osrednje' : selectedStar() === 3 ? 'Dobro' : selectedStar() === 4 ? 'Odlično' : 'Izvrsno!' }}
      </p>
    }

    <div class="mb-6">
      <label class="font-dm text-[11px] tracking-[0.1em] uppercase text-white/35 mb-2 block">
        Komentar <span class="text-white/20 normal-case tracking-normal">(opcionalno)</span>
      </label>
      <textarea
        [(ngModel)]="comment"
        rows="3"
        placeholder="Podijeli svoje iskustvo..."
        maxlength="500"
        class="w-full rounded-2xl border border-white/[0.08] bg-white/[0.03] px-4 py-3
               font-dm text-[13px] text-white/80 placeholder:text-white/20
               resize-none outline-none transition-all duration-200
               focus:border-violet-500/40 focus:bg-white/[0.05]"
      ></textarea>
      <p class="text-right font-dm text-[11px] text-white/20 mt-1">{{ comment.length }}/500</p>
    </div>

    <div class="flex gap-3">
      <button type="button" (click)="close.emit()"
        class="flex-1 rounded-2xl border border-white/[0.08] bg-white/[0.03] px-4 py-3
               font-dm text-[13px] text-white/50 hover:text-white/80 hover:bg-white/[0.06]
               transition-all duration-200">
        Otkaži
      </button>
      <button
        type="button"
        (click)="onSubmit()"
        [disabled]="selectedStar() === 0 || isSubmitting()"
        class="flex-1 rounded-2xl px-4 py-3 font-dm font-semibold text-[13px] text-white
               transition-all duration-200 disabled:opacity-40 disabled:cursor-not-allowed
               hover:scale-[1.02] active:scale-[0.98]"
        style="background: linear-gradient(135deg, #7c3aed 0%, #5b21b6 100%);
               box-shadow: 0 4px 20px rgba(124,58,237,0.35);"
      >
        @if (isSubmitting()) {
          <svg class="animate-spin h-4 w-4 mx-auto" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
          </svg>
        } @else {
          Pošalji ocjenu
        }
      </button>
    </div>
  </div>
</div>
