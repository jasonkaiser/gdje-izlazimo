spring:
  application:
    name: gdje-izlazimo

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gdje_izlazimo}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost:8080/realms/gdje-izlazimo}
          jwk-set-uri: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

app:
  mail:
    from: ${APP_MAIL_FROM:noreply@gdje-izlazimo.local}

server:
  port: ${PORT:8081}

logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
        orm:
          jdbc:
            bind: TRACE
      springframework:
        web: DEBUG

# Keycloak (used for admin / internal calls if needed)
keycloak:
  server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8080}
  realm: ${KEYCLOAK_REALM:gdje-izlazimo}
  admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:spring-admin-client}
  admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:changeme}

# ImageKit
imagekit:
  public-key: ${IMAGEKIT_PUBLIC_KEY:public_key_here}
  private-key: ${IMAGEKIT_PRIVATE_KEY:private_key_here}
  url-endpoint: ${IMAGEKIT_URL_ENDPOINT:https://ik.imagekit.io/your-id/}

# API Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  scalar:
    path: /scalar