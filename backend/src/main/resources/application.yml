spring:
  application:
    name: gdje-izlazimo

  datasource:
    url: jdbc:postgresql://localhost:5432/gdje_izlazimo
    username: postgres
    password: jason123

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/gdje-izlazimo
          jwk-set-uri: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs

  # SMTP configuration (MailHog for local dev)
  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

# Application-level email settings
app:
  mail:
    from: noreply@gdje-izlazimo.local

server:
  port: 8081

logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
        orm:
          jdbc:
            bind: TRACE
      springframework:
        web: DEBUG

